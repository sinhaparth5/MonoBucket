name: Release

# Tags are CalVer: v2026.08.0, v2026.08.1-beta.2, ...
on:
  push:
    tags: ["v[0-9][0-9][0-9][0-9].[0-9][0-9].*"]
  workflow_dispatch:
    inputs:
      version:
        description: "CalVer version to publish, e.g. 2026.08.0"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # The tag is the source of truth; CMakeLists.txt must agree with it.
          CMAKE_VERSION="$(sed -n 's/^set(MONOBUCKET_VERSION_YEAR *\([0-9]*\))/\1/p'  CMakeLists.txt)"
          CMAKE_VERSION="$CMAKE_VERSION.$(sed -n 's/^set(MONOBUCKET_VERSION_MONTH *\([0-9]*\))/\1/p' CMakeLists.txt)"
          CMAKE_VERSION="$CMAKE_VERSION.$(sed -n 's/^set(MONOBUCKET_VERSION_MICRO *\([0-9]*\))/\1/p' CMakeLists.txt)"
          BASE="${VERSION%%-*}"
          if [ "$CMAKE_VERSION" != "$BASE" ]; then
            echo "::error::tag says $BASE but CMakeLists.txt says $CMAKE_VERSION"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=match,pattern=v(\d{4}\.\d{2}),group=1,enable=${{ !contains(steps.version.outputs.version, '-') }}
            type=match,pattern=v(\d{4})\.,group=1,enable=${{ !contains(steps.version.outputs.version, '-') }}
            type=raw,value=latest,enable=${{ !contains(steps.version.outputs.version, '-') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MONOBUCKET_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract release notes
        id: notes
        run: |
          # Everything between this version's heading and the next one.
          awk -v ver="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && /^## \[/       { exit }
            capture                   { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::no CHANGELOG.md section found for ${{ steps.version.outputs.version }}"
            echo "See CHANGELOG.md." > release-notes.md
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
