# MonoBucket on a VPS, behind a reverse proxy that terminates TLS.
#
# The one thing that decides this file's shape: MonoBucket serves two listeners
# and dispatches on which port a request arrived at (s3/router.cpp). They cannot
# share a hostname — the console is a client-rendered SPA that owns `/`,
# `/login`, `/buckets`, `/_app/*`, and every one of those is a legal path-style
# bucket name. So: one hostname per listener, both proxied to loopback.
#
#   https://s3.wepyxis.space       ->  127.0.0.1:18089
#   https://console.wepyxis.space  ->  127.0.0.1:18090
#
# Start with:  docker compose --env-file .env up -d

name: monobucket

services:
  monobucket:
    image: ghcr.io/sinhaparth5/monobucket:${MONOBUCKET_VERSION:?set MONOBUCKET_VERSION in .env}
    restart: unless-stopped

    # Bound to loopback, not 0.0.0.0. The WAF is the only thing that may reach
    # these; published on all interfaces they would also be reachable directly
    # on the VPS's public IP, which is the whole proxy bypassed.
    ports:
      - "127.0.0.1:18089:9000"  # S3 API      <- s3.wepyxis.space
      - "127.0.0.1:18090:9001"  # console     <- console.wepyxis.space

    # Delivered as a file rather than an environment variable: a value in
    # `environment:` shows up in `docker inspect` and /proc/<pid>/environ.
    secrets:
      - monobucket_admin_password

    environment:
      MONOBUCKET_DATA_DIR: /data
      MONOBUCKET_HOST: 0.0.0.0        # inside the container; the port bind above is the boundary
      MONOBUCKET_REGION: ${MONOBUCKET_REGION:-us-east-1}

      # The origin S3 clients reach this deployment at. The console signs it as
      # the host of every presigned URL, and `location` in the browser describes
      # the console rather than the S3 listener, so it cannot be derived.
      MONOBUCKET_S3_PUBLIC_URL: ${MONOBUCKET_S3_PUBLIC_URL:?set the public S3 origin}

      # --- Console sign-in ---------------------------------------------------
      MONOBUCKET_ADMIN_USERNAME: ${MONOBUCKET_ADMIN_USERNAME:-admin}
      MONOBUCKET_ADMIN_PASSWORD_FILE: /run/secrets/monobucket_admin_password

      # Forced, not left on `auto`. `auto` marks the session cookie Secure when
      # the request arrived over TLS *or* a proxy said so with
      # X-Forwarded-Proto. coraza-waf-mod's reverse proxy never sets that
      # header, so the hop it sees is plain HTTP and `auto` would ship the
      # cookie without Secure on an HTTPS site.
      MONOBUCKET_CONSOLE_COOKIE_SECURE: "true"

      # --- S3 break-glass credential -----------------------------------------
      # Signs S3 requests and nothing else; it has not been a console login
      # since user accounts existed. It cannot be revoked from the console, so
      # treat it as break-glass and issue per-client keys from the console.
      MONOBUCKET_ROOT_ACCESS_KEY: ${MONOBUCKET_ROOT_ACCESS_KEY:?set a root access key}
      MONOBUCKET_ROOT_SECRET_KEY: ${MONOBUCKET_ROOT_SECRET_KEY:?set a root secret key}

      # --- Storage allocations ------------------------------------------------
      # Set explicitly, because the derived figure assumes the filesystem
      # holding /data is MonoBucket's alone. On a VPS it is the root disk, with
      # the OS, the WAF and its SQLite on it too.
      MONOBUCKET_ALLOCATABLE_BYTES: ${MONOBUCKET_ALLOCATABLE_BYTES:?size this to the volume}
      # What a bucket made by plain S3 CreateBucket gets, which has no field to
      # ask for one. 0 leaves those buckets unlimited.
      MONOBUCKET_DEFAULT_BUCKET_QUOTA_BYTES: ${MONOBUCKET_DEFAULT_BUCKET_QUOTA_BYTES:-0}

      # --- Durability and memory ---------------------------------------------
      # strict survives a power cut at the cost of an fsync per commit. On a VPS
      # whose disk you do not control, that is usually the right trade.
      MONOBUCKET_DURABILITY: ${MONOBUCKET_DURABILITY:-strict}
      MONOBUCKET_METADATA_MEMORY_BYTES: ${MONOBUCKET_METADATA_MEMORY_BYTES:-32MiB}
      MONOBUCKET_CACHE_MAX_BYTES: ${MONOBUCKET_CACHE_MAX_BYTES:-128MiB}

      # --- /metrics -----------------------------------------------------------
      # Off by default here, and that is deliberate. /metrics, /readyz and
      # /healthz are registered without port scoping, so they answer on BOTH
      # listeners with no authentication — including on s3.wepyxis.space, where
      # /readyz would hand a stranger the data directory path, the bucket and
      # object counts and the free disk, and /metrics would now add every
      # bucket's name and byte count. Turn it back on only once the WAF denies
      # those paths on both services.
      MONOBUCKET_METRICS_ENABLED: ${MONOBUCKET_METRICS_ENABLED:-false}

      MONOBUCKET_LOG_LEVEL: ${MONOBUCKET_LOG_LEVEL:-info}

    volumes:
      - monobucket-data:/data

    # The container runs as uid 1000 and only ever writes under /data.
    read_only: true
    tmpfs:
      - /tmp

    deploy:
      resources:
        limits:
          # Reads and mixed traffic sit a few MiB above idle. Concurrent large
          # single-PUT uploads are the exception and track concurrency × object
          # size — see "Known limitations" in README.md. Raise this if clients
          # push big objects in parallel.
          memory: ${MONOBUCKET_MEMORY_LIMIT:-512M}

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  monobucket-data:

secrets:
  monobucket_admin_password:
    file: ./secrets/admin_password.txt
