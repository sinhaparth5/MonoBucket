name: monobucket

services:
  monobucket:
    build:
      context: .
      args:
        MONOBUCKET_VERSION: ${MONOBUCKET_VERSION:-dev}
    image: monobucket:${MONOBUCKET_VERSION:-dev}
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Admin dashboard
    # Delivered as a file rather than an environment variable: a value in
    # `environment:` shows up in `docker inspect` and in /proc/<pid>/environ.
    secrets:
      - monobucket_admin_password
    environment:
      MONOBUCKET_DATA_DIR: /data
      # Where the console's backup action may write. Commented out because the
      # action is off until a directory exists to hold its output. Mount a
      # volume at /backups and uncomment to switch it on; keeping it on the
      # same filesystem as /data is what makes a backup free rather than a full
      # copy, since payloads are hard-linked.
      # MONOBUCKET_BACKUP_DIR: /backups
      # Who signs in to the dashboard. There is no default password: create
      # secrets/admin_password.txt (>= 12 characters) before the first start,
      # or the container refuses to come up and says so.
      MONOBUCKET_ADMIN_USERNAME: ${MONOBUCKET_ADMIN_USERNAME:-admin}
      MONOBUCKET_ADMIN_PASSWORD_FILE: /run/secrets/monobucket_admin_password
      # The bootstrap S3 key pair. It signs S3 requests and nothing else — it
      # has not been a console login since the administrator account existed.
      # Day-to-day credentials are issued from the console instead.
      MONOBUCKET_ROOT_ACCESS_KEY: ${MONOBUCKET_ROOT_ACCESS_KEY:-monobucket}
      MONOBUCKET_ROOT_SECRET_KEY: ${MONOBUCKET_ROOT_SECRET_KEY:-monobucket-dev-secret}
      MONOBUCKET_REGION: ${MONOBUCKET_REGION:-us-east-1}
      # relaxed survives a process crash; use strict on a volume you care about,
      # at the cost of an fsync per commit.
      MONOBUCKET_DURABILITY: ${MONOBUCKET_DURABILITY:-relaxed}
      # Counts against the 256M cap below, so it is set explicitly rather than
      # left to the default.
      MONOBUCKET_METADATA_MEMORY_BYTES: ${MONOBUCKET_METADATA_MEMORY_BYTES:-32MiB}
      # 'redis' needs an image built with -DMONOBUCKET_ENABLE_REDIS=ON and the
      # redis profile below; otherwise the setting is ignored with a warning.
      MONOBUCKET_CACHE_BACKEND: ${MONOBUCKET_CACHE_BACKEND:-memory}
      MONOBUCKET_CACHE_MAX_BYTES: ${MONOBUCKET_CACHE_MAX_BYTES:-128MiB}
      MONOBUCKET_CACHE_TTL_SECONDS: ${MONOBUCKET_CACHE_TTL_SECONDS:-300}
      MONOBUCKET_REDIS_URL: ${MONOBUCKET_REDIS_URL:-redis://redis:6379}
      MONOBUCKET_LOG_LEVEL: ${MONOBUCKET_LOG_LEVEL:-info}
    volumes:
      - monobucket-data:/data
    # The container runs as uid 1000 and only ever writes under /data.
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          # Reads and mixed traffic sit a few MiB above idle, so this cap is
          # generous for them. Concurrent large single-PUT uploads are the
          # exception and can approach it — see "Known limitations" in
          # README.md. Raise this if you upload big objects in parallel.
          memory: 256M

  # Optional Redis cache backend (Phase 3). Start with:
  #   docker compose --profile redis up
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - monobucket-redis:/data

volumes:
  monobucket-data:
  monobucket-redis:

secrets:
  monobucket_admin_password:
    file: ./secrets/admin_password.txt
